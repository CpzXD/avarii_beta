<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin avarii</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/branding/branding.css"><style>
*{box-sizing:border-box}html,body{width:100%;max-width:100%;height:100%;overflow:hidden}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0f172a;color:#172033}.top{height:64px;background:#111827;color:#fff;padding:0 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:nowrap;position:relative;z-index:20}.top b{font-size:18px;line-height:1.2}.top .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.top a,.top button{background:#263244;color:#fff;border:0;border-radius:999px;padding:10px 13px;text-decoration:none;font-weight:800;cursor:pointer;min-height:40px}.top a.primary{background:#16a34a}.layout{display:grid;grid-template-columns:380px minmax(0,1fr);height:calc(100dvh - 64px);min-height:0;overflow:hidden}aside{background:#f8fafc;height:100%;overflow-y:auto;overflow-x:hidden;padding:14px;border-right:1px solid #334155;min-height:0;overscroll-behavior:contain}#map{width:100%;height:100%;min-height:0}.leaflet-container{width:100%;height:100%}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}.stat{background:#fff;border-radius:18px;padding:13px;box-shadow:0 8px 22px rgba(15,23,42,.06)}.stat b{font-size:24px;display:block}.search{margin:12px 0}.search input{width:100%;min-height:44px;border:1px solid #dbe3ef;background:#fff;border-radius:14px;padding:0 14px;font-size:15px;font-weight:700;outline:none}.search input:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters button{border:1px solid #dbe3ef;background:white;padding:10px 12px;border-radius:999px;font-weight:800;cursor:pointer;min-height:40px}.filters button.active{background:#111827;color:#fff}.item{background:#fff;border:1px solid #e5e7eb;border-radius:18px;margin:10px 0;padding:13px}.item h3{margin:6px 0;font-size:16px}.item a{font-weight:800;color:#1d4ed8}.muted{color:#64748b;font-size:13px;line-height:1.45}.badge{display:inline-block;padding:5px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:900}.noua{background:#e11d48}.confirmata{background:#f97316}.in_lucru{background:#0d9488}.rezolvata{background:#22c55e}.popup{min-width:min(280px,80vw)}.popup select,.popup textarea{width:100%;margin-top:8px;padding:10px;border:1px solid #d8e0ea;border-radius:10px;font-size:15px}.popup button{width:100%;margin-top:8px;padding:10px;border:0;border-radius:10px;background:#111827;color:white;font-weight:800;cursor:pointer}.popup .danger{background:#dc2626}.panel-title{font-weight:900;margin:4px 0 10px}.leaflet-popup-content-wrapper{max-height:calc(100dvh - 120px);overflow:hidden}.leaflet-popup-content{font-size:14px;max-height:calc(100dvh - 170px);overflow-y:auto;padding-right:4px}.leaflet-control-attribution{font-size:10px}.mobile-blocker{display:none}
@media(max-width:900px){html,body{height:auto;min-height:100%;overflow:auto}body{background:#f6f8fb;color:#172033}.top,.layout{display:none!important}.mobile-blocker{display:block;min-height:100dvh;padding:22px 16px}.mobile-blocker .box{max-width:460px;margin:0 auto;background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:22px;box-shadow:0 14px 40px rgba(15,23,42,.12)}.mobile-blocker a{display:inline-flex;margin-top:12px;background:#16a34a;color:white;padding:12px 15px;border-radius:999px;text-decoration:none;font-weight:900}.top{align-items:stretch;padding:12px}.top>div,.top .actions{width:100%}.top .actions{display:grid;grid-template-columns:1fr}.top a,.top button{width:100%;text-align:center}.layout{display:flex;flex-direction:column;min-height:0}#map{order:1;height:52dvh;min-height:360px}aside{order:2;border-right:0;border-top:1px solid #334155}.stats{grid-template-columns:1fr 1fr}.filters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}.filters button{white-space:nowrap;flex:0 0 auto}.leaflet-control-zoom a{width:38px!important;height:38px!important;line-height:38px!important}}
@media(max-width:430px){.stats{grid-template-columns:1fr}.top b{font-size:16px}aside{padding:12px}#map{height:50dvh;min-height:330px}.popup{min-width:250px}}
</style></head><body><div class="mobile-blocker"><div class="box"><img class="mobile-brand-logo" src="/branding/luxten-logo.png" alt="LUXTEN"><h1>Admin doar pe PC</h1><a href="/harta.html">Avarii iluminat</a></div></div><div class="top"><div class="admin-brand"><img class="brand-mark" src="/branding/luxten-symbol.png" alt=""><b>Admin avarii</b></div><div class="actions"><button onclick="AvariiSecurity.clearSession('admin');location.href='/admin-login.html'">Ieșire</button></div></div><div class="layout"><aside><div class="panel-title" id="hello">Panou admin</div><div class="stats"><div class="stat"><b id="total">0</b><span class="muted">total</span></div><div class="stat"><b id="urgent">0</b><span class="muted">noi / de verificat</span></div><div class="stat"><b id="work">0</b><span class="muted">în lucru</span></div><div class="stat"><b id="done">0</b><span class="muted">rezolvate</span></div></div><div class="search"><input id="search" type="search" placeholder="Caută stradă, titlu, cetățean..." autocomplete="off"></div><div class="filters"><button class="active" data-f="toate">Toate</button><button data-f="noua">Noi</button><button data-f="confirmata">Confirmate</button><button data-f="in_lucru">În lucru</button><button data-f="rezolvata">Rezolvate</button></div><div id="lista"></div></aside><div id="map"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/map-config.js"></script><script src="/location-utils.js"></script><script src="/security-client.js"></script><script>
if(window.matchMedia('(max-width: 900px)').matches){throw new Error('Admin desktop only')}
const admin=JSON.parse(localStorage.getItem('admin')||'null');if(!admin||!AvariiSecurity.tokenFor('admin')){AvariiSecurity.clearSession('admin');location.href='/admin-login.html'}else{hello.textContent=`Admin: ${admin.prenume} ${admin.nume}`}const labels={noua:'Nouă',confirmata:'Confirmată',in_lucru:'În lucru',rezolvata:'Rezolvată'};const colors={noua:'#e11d48',confirmata:'#f97316',in_lucru:'#0d9488',rezolvata:'#22c55e'};let avarii=[],markers=[],filter='toate',query='';
const map=createAvariiMap('map',{mode:'admin',center:AVARII_ADMIN_MAP_CONFIG.center,zoom:12,scrollWheelZoom:true,wheelDebounceTime:40,wheelPxPerZoomLevel:80,maxBoundsViscosity:.65});
function icon(s){return L.divIcon({className:'',html:`<div style="background:${colors[s]||'#555'};width:24px;height:24px;border-radius:50%;border:3px solid white;box-shadow:0 4px 12px rgba(0,0,0,.35)"></div>`,iconSize:[24,24],iconAnchor:[12,12]})}function fmt(d){return new Date(d).toLocaleString('ro-RO')}function locationText(a){return avariiLocationLabel(a)}function feedbackValue(f){const value=Number(f?.stele);if(Number.isInteger(value)&&value>=1&&value<=5)return value;if(f?.raspuns==='da')return 5;if(f?.raspuns==='nu')return 1;return 0}function feedbackSummary(a){const values=(a.feedback||[]).map(feedbackValue).filter(Boolean);if(!values.length)return '—';const avg=values.reduce((sum,value)=>sum+value,0)/values.length;return `${avg.toFixed(values.length>1?1:0)}/5 · ${values.length} evaluare${values.length===1?'':'i'}`}
async function api(url,options={}){const r=await AvariiSecurity.authFetch(url,options,'admin');if(r.status===401){location.href='/admin-login.html';throw new Error('Autentificare invalidă')}return r}async function updateStatus(id){const s=document.getElementById('st-'+id).value;const mesaj=document.getElementById('ms-'+id).value;const r=await api('/avarii/'+id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s,mesaj})});const data=await r.json();if(!r.ok)return alert(data.eroare||'Nu am putut actualiza.');load()}async function sendMsg(id){const t=document.getElementById('chat-'+id).value.trim();if(!t)return;const r=await api(`/avarii/${id}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mesaj:t})});const data=await r.json();if(!r.ok)return alert(data.eroare||'Nu am putut trimite mesajul.');load()}async function del(id){if(!confirm('Ștergi definitiv sesizarea?'))return;const r=await api('/avarii/'+id,{method:'DELETE'});const data=await r.json();if(!r.ok)return alert(data.eroare||'Nu am putut șterge.');map.closePopup();load()}window.updateStatus=updateStatus;window.sendMsg=sendMsg;window.del=del;
function popup(a){return `<div class="popup"><b>${a.titlu}</b><br><span class="badge ${a.status}">${labels[a.status]}</span><p><b>Locație:</b> ${locationText(a)}<br><b>Autor:</b> ${a.autor||'Cetățean'}<br><b>Email:</b> ${a.emailAutor||'—'}<br><b>Urmăritori:</b> ${a.urmaritori||0}<br><b>Evaluare:</b> ${feedbackSummary(a)}</p><select id="st-${a.id}"><option value="noua" ${a.status==='noua'?'selected':''}>Nouă</option><option value="confirmata" ${a.status==='confirmata'?'selected':''}>Confirmată</option><option value="in_lucru" ${a.status==='in_lucru'?'selected':''}>În lucru</option><option value="rezolvata" ${a.status==='rezolvata'?'selected':''}>Rezolvată</option></select><textarea id="ms-${a.id}" placeholder="Mesaj public pentru cetățean, ex: echipa ajunge azi..."></textarea><button onclick="updateStatus('${a.id}')">Actualizează status + notificare</button><textarea id="chat-${a.id}" placeholder="Răspuns în chat"></textarea><button onclick="sendMsg('${a.id}')">Trimite mesaj</button><button onclick="location.href='/sesizare-detalii.html?id=${a.id}&from=admin'">Deschide conversația</button><button class="danger" onclick="del('${a.id}')">Șterge</button></div>`}
function matchesSearch(a){if(!query)return true;const text=[a.titlu,a.descriere,a.categorie,locationText(a),a.autor,a.emailAutor,labels[a.status],a.status].filter(Boolean).join(' ').toLowerCase();return text.includes(query)}function filtered(){return avarii.filter(a=>(filter==='toate'||a.status===filter)&&matchesSearch(a))}function render(){markers.forEach(m=>map.removeLayer(m));markers=[];const arr=filtered();total.textContent=avarii.length;urgent.textContent=avarii.filter(a=>a.status==='noua'||a.status==='confirmata').length;work.textContent=avarii.filter(a=>a.status==='in_lucru').length;done.textContent=avarii.filter(a=>a.status==='rezolvata').length;lista.innerHTML='';arr.forEach(a=>{if(a.lat&&a.lng){const m=L.marker([a.lat,a.lng],{icon:icon(a.status)}).addTo(map);m.bindPopup(popup(a),{maxWidth:330,maxHeight:Math.max(300,window.innerHeight-190),autoPan:true,keepInView:true,autoPanPaddingTopLeft:L.point(30,100),autoPanPaddingBottomRight:L.point(30,30)});m.on('click',()=>{if(map.getZoom()<14)map.setView([a.lat,a.lng],14,{animate:true})});markers.push(m)}const el=document.createElement('div');el.className='item';el.innerHTML=`<span class="badge ${a.status}">${labels[a.status]}</span><h3>${a.titlu}</h3><div class="muted">${a.categorie} · ${fmt(a.dataRaportare)}</div><div class="muted">${a.autor||'Cetățean'} · ${locationText(a)}</div><div class="muted">${a.urmaritori||0} urmăritori · evaluare ${feedbackSummary(a)}</div><p><a href="/sesizare-detalii.html?id=${a.id}&from=admin">Conversație</a></p>`;lista.appendChild(el)});if(!arr.length)lista.innerHTML='<p class="muted">Nu există rezultate.</p>';requestAnimationFrame(()=>map.invalidateSize())}
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render()});const searchInput=document.getElementById('search');searchInput.addEventListener('input',()=>{query=searchInput.value.trim().toLowerCase();render()});async function load(){const r=await api('/avarii');if(!r.ok)return;avarii=await r.json();render()}load();setInterval(load,10000);
</script></body></html>
