<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login cetățean</title><link rel="stylesheet" href="/branding/branding.css"><style>
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(135deg,#edf4ff,#f7f9fc);margin:0;color:#172033}.wrap{max-width:440px;margin:0 auto;padding:28px 18px}.card{background:#fff;border-radius:24px;padding:26px;box-shadow:0 20px 55px rgba(20,45,80,.12)}h1{margin:0 0 6px;font-size:28px}.muted{color:#607087;line-height:1.45}label{display:block;margin:16px 0 7px;font-weight:700}input{width:100%;padding:13px;border:1px solid #d8e0ea;border-radius:12px;font-size:16px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:#1d4ed8;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.link{display:block;text-align:center;margin-top:16px;color:#1d4ed8;text-decoration:none;font-weight:700}.err{display:none;background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px;margin-top:14px}.demo{background:#eff6ff;color:#1e3a8a;padding:12px;border-radius:14px;margin:16px 0;font-size:14px}nav{display:flex;gap:8px;margin-bottom:18px}nav a{color:#334155;text-decoration:none;background:#fff;padding:9px 12px;border-radius:999px;font-size:14px}
@media(max-width:520px){.desktop-only{display:none!important}body{overflow-x:hidden}.wrap{padding:16px 12px}.card{border-radius:18px;padding:20px}nav{display:grid!important;grid-template-columns:1fr!important}nav a{width:100%;text-align:center;display:block}input,button{font-size:16px}}</style></head><body><div class="wrap"><nav><a href="/harta.html">Avarii iluminat</a></nav><div class="card"><img class="auth-logo" src="/branding/luxten-logo.png" alt="LUXTEN"><h1>Intră în cont</h1><div class="demo">Demo: <b>user@demo.ro</b> / <b>user123</b></div><form id="f"><label>Email</label><input id="email" type="email" required value="user@demo.ro"><label>Parolă</label><input id="parola" type="password" required value="user123"><button>Continuă</button><div id="err" class="err"></div></form><a class="link" href="/register.html">Nu ai cont? Creează cont</a></div></div><script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.style.display='none';const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,parola:parola.value,rol:'user'})});const j=await r.json();if(!r.ok){err.textContent=j.eroare||'Eroare login';err.style.display='block';return}localStorage.setItem('user',JSON.stringify(j.user));location.href='/harta.html'};
</script></body></html>
