<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Detalii sesizare</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body{width:100%;max-width:100%;overflow-x:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:1120px;margin:0 auto;padding:18px 14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.top h1{margin:0 0 6px;line-height:1.15;font-size:26px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:12px 14px;background:#1d4ed8;color:#fff;text-decoration:none;font-weight:900;cursor:pointer;min-height:44px}.btn.primary{background:#16a34a}.btn.dark{background:#0f172a}.ghost{background:#fff;color:#1d4ed8;border:1px solid #dbeafe}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;margin-top:16px}.card{background:white;border-radius:22px;padding:18px;box-shadow:0 12px 34px rgba(15,23,42,.07);border:1px solid #e5e7eb;margin-bottom:14px}.badge{display:inline-block;padding:6px 11px;border-radius:999px;color:#fff;font-size:12px;font-weight:900}.noua{background:#e11d48}.confirmata{background:#f97316}.in_lucru{background:#0d9488}.rezolvata{background:#22c55e}.muted{color:#64748b;line-height:1.5}.meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.meta-box{background:#f8fafc;border:1px solid #edf2f7;border-radius:16px;padding:12px}.meta-box b{display:block}.timeline{margin:14px 0}.tl{display:grid;grid-template-columns:34px 1fr;gap:10px;margin-bottom:12px}.dot{width:26px;height:26px;border-radius:999px;background:#dbeafe;border:5px solid #fff;box-shadow:0 0 0 2px #bfdbfe}.tl.done .dot{background:#22c55e;box-shadow:0 0 0 2px #bbf7d0}.tl-body{border-bottom:1px solid #eef2f7;padding-bottom:10px}.tl-body b{display:block}.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding-right:4px}.msg{padding:12px;border-radius:16px;background:#f1f5f9;word-break:break-word}.msg.admin{background:#eff6ff}.msg.sistem{background:#ecfdf5}.msg .meta{font-size:12px;color:#64748b;margin-bottom:4px}textarea{width:100%;min-height:95px;padding:13px;border:1px solid #cbd5e1;border-radius:14px;font-size:16px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:14px;font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}#map{height:300px;border-radius:18px;background:#e2e8f0}.photo{width:100%;border-radius:18px;margin-top:12px}.follow-card{background:#eef2ff;color:#1e3a8a;border:1px solid #c7d2fe}.feedback{background:#f0fdf4;border:1px solid #bbf7d0}.feedback-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.leaflet-control-attribution{font-size:10px}.result{display:none;margin-top:10px;border-radius:14px;padding:11px}.result.ok{display:block;background:#dcfce7;color:#166534}.result.err{display:block;background:#fee2e2;color:#991b1b}
@media(max-width:850px){.layout{grid-template-columns:1fr}.wrap{padding:14px 10px 86px}.top{align-items:stretch}.top>div{width:100%}.actions{display:grid;grid-template-columns:1fr}.btn{width:100%;padding:13px 14px}.card{border-radius:18px;padding:15px}#map{height:300px}.chat{max-height:50dvh}.meta-grid{grid-template-columns:1fr 1fr}.top h1{font-size:22px}}
@media(max-width:380px){#map{height:260px}.card{padding:13px}.meta-grid{grid-template-columns:1fr}.feedback-actions{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h1 id="title">Sesizare</h1><p class="muted" id="sub"></p></div><div class="actions" id="topActions"></div></div><div id="main"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const params=new URLSearchParams(location.search);
const id=params.get('id');
const from=params.get('from')||'user';
const isMobile=window.matchMedia('(max-width: 900px)').matches;
const user=JSON.parse(localStorage.getItem('user')||'null');
const admin=(from==='admin'&&!isMobile)?JSON.parse(localStorage.getItem('admin')||'null'):null;
let deviceId=localStorage.getItem('deviceId');if(!deviceId){deviceId='dev-'+Date.now()+'-'+Math.round(Math.random()*1e6);localStorage.setItem('deviceId',deviceId)}
const labels={noua:'Nouă',confirmata:'Confirmată',in_lucru:'În lucru',rezolvata:'Rezolvată'};
const pasi=['noua','confirmata','in_lucru','rezolvata'];
function fmt(d){return new Date(d).toLocaleString('ro-RO',{dateStyle:'short',timeStyle:'short'})}
function who(){return user?{userId:user.id,nume:`${user.prenume} ${user.nume}`,email:user.email,deviceId}:{deviceId,nume:'Cetățean'}}
function isOwnAvarie(a){return !!(user && (a.userId===user.id || a.emailAutor===user.email))}
function isFollowingAvarie(a){return !!(user && (a.followers||[]).some(f=>f.userId===user.id || f.email===user.email))}
function followCardHtml(a){if(admin||isOwnAvarie(a))return '';if(isFollowingAvarie(a))return `<div class="card follow-card"><h2>Urmărită</h2></div>`;return `<div class="card follow-card"><h2>Urmărește</h2><button class="btn dark" onclick="follow()">Urmăresc și eu</button></div>`}
async function follow(){const r=await fetch(`/avarii/${id}/follow`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(who())});if(r.ok)load()}
async function sendFeedback(raspuns){const msg=document.getElementById('feedback-msg');const text=document.getElementById('feedback-text')?.value||'';const res=await fetch(`/avarii/${id}/feedback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...who(),raspuns,mesaj:text})});if(res.ok){msg.className='result ok';msg.textContent=raspuns==='da'?'Mulțumim. Feedbackul a fost salvat.':'Mulțumim. Sesizarea a fost redeschisă pentru reverificare.';setTimeout(load,700)}else{msg.className='result err';msg.textContent='Nu am putut salva feedbackul.'}}
window.follow=follow;window.sendFeedback=sendFeedback;
const topActions=document.getElementById('topActions');
topActions.innerHTML=admin?`<a class="btn ghost" href="/admin.html">← Înapoi la admin</a>`:`<a class="btn ghost" href="/harta.html">Înapoi</a>`;
function timelineHtml(a){const hist=a.statusHistory||[];return pasi.map((p,i)=>{const h=hist.find(x=>x.status===p);const isDone=hist.some(x=>x.status===p)||pasi.indexOf(a.status)>=i;return `<div class="tl ${isDone?'done':''}"><div class="dot"></div><div class="tl-body"><b>${labels[p]}</b><span class="muted">${h?`${fmt(h.data)} — ${h.mesaj}`:'În așteptare'}</span></div></div>`}).join('')}
function feedbackHtml(a){if(a.status!=='rezolvata')return '';const last=(a.feedback||[]).slice(-1)[0];return `<div class="card feedback"><h2>Confirmare rezolvare</h2><p class="muted">Problema este rezolvată în teren?</p>${last?`<p><b>Ultimul feedback:</b> ${last.raspuns==='da'?'Da, este rezolvată':'Nu, trebuie reverificată'}</p>`:''}<textarea id="feedback-text" placeholder="Opțional: adaugă un detaliu scurt"></textarea><div class="feedback-actions"><button class="btn primary" onclick="sendFeedback('da')">Da</button><button class="btn dark" onclick="sendFeedback('nu')">Nu</button></div><div id="feedback-msg" class="result"></div></div>`}
async function load(){const r=await fetch('/avarii/'+id);if(!r.ok){main.innerHTML='<div class="card">Sesizarea nu a fost găsită.</div>';return}const a=await r.json();title.textContent=a.titlu;sub.textContent=`${a.categorie} · raportată la ${fmt(a.dataRaportare)}`;main.innerHTML=`<div class="layout"><section><div class="card"><span class="badge ${a.status}">${labels[a.status]}</span><h2>Detalii</h2>${a.descriere?`<p>${a.descriere}</p>`:''}<div class="meta-grid"><div class="meta-box"><b>${a.urmaritori||0}</b><span class="muted">urmăritori</span></div><div class="meta-box"><b>${fmt(a.actualizatLa||a.dataRaportare)}</b><span class="muted">ultima actualizare</span></div></div><p class="muted"><b>Adresă:</b> ${a.adresaText||'Locație GPS'}</p><p class="muted"><b>Raportat de:</b> ${a.autor||'Cetățean'}</p><div id="map"></div>${a.pozaUrl?`<img class="photo" src="${a.pozaUrl}" alt="Poză avarie">`:''}</div><div class="card"><h2>Timeline</h2><div class="timeline">${timelineHtml(a)}</div></div>${feedbackHtml(a)}</section><section>${followCardHtml(a)}<div class="card"><h2>Comunicare</h2><div class="chat" id="chat">${(a.mesaje||[]).map(m=>`<div class="msg ${m.rol}"><div class="meta">${m.autor} · ${fmt(m.data)}</div>${m.mesaj}</div>`).join('')}</div><form id="msgForm"><textarea id="mesaj" placeholder="Scrie un mesaj sau o clarificare..."></textarea><button class="btn" type="submit">Trimite mesaj</button></form></div></section></div>`;if(a.lat&&a.lng){const map=L.map('map').setView([a.lat,a.lng],16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}).addTo(map);L.marker([a.lat,a.lng]).addTo(map)}else{document.getElementById('map').innerHTML='<p class="muted">Sesizarea are adresă scrisă manual.</p>'}document.getElementById('msgForm').onsubmit=async e=>{e.preventDefault();if(!mesaj.value.trim())return;const autor=admin?'Admin':(user?`${user.prenume} ${user.nume}`:'Cetățean');const rol=admin?'admin':'user';await fetch(`/avarii/${id}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mesaj:mesaj.value,autor,rol})});load()}}
load();setInterval(load,12000);
</script></body></html>
