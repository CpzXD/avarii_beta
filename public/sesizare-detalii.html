5px 14px rgba(15,23,42,.05);word-break:break-word;align-self:flex-start}.msg.own{align-self:flex-end}.msg.user{background:#ecfdf5;border-color:#bbf7d0}.msg.admin{background:#fff7ed;border-color:#fed7aa}.msg.sistem{background:#eff6ff;border-color:#bfdbfe;align-self:center;max-width:94%}.msg .meta{font-size:12px;color:#64748b;margin-bottom:6px;display:flex;align-items:center;gap:6px;font-weight:800}.role-dot{width:8px;height:8px;border-radius:999px;display:inline-block;flex:0 0 auto}.msg.user .role-dot{background:#22c55e}.msg.admin .role-dot{background:#f97316}.msg.sistem .role-dot{background:#3b82f6}.message-time{font-weight:500;color:#94a3b8}textarea{width:100%;min-height:95px;padding:13px;border:1px solid #cbd5e1;border-radius:14px;font-size:16px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:14px;font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}#map{height:300px;border-radius:18px;background:#e2e8f0}.photo{width:100%;border-radius:18px;margin-top:12px}.follow-card{background:#eef2ff;color:#1e3a8a;border:1px solid #c7d2fe}.feedback{background:#fff;border:1px solid #e5e7eb;position:relative;overflow:hidden}.feedback:before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#f59e0b,#f97316)}.feedback-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}.feedback-head h2{margin:0 0 3px}.feedback-head p{margin:0}.feedback-icon{width:44px;height:44px;border-radius:14px;background:#fff7ed;color:#f59e0b;display:grid;place-items:center;font-size:24px;font-weight:900;flex:0 0 auto}.feedback-current{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:11px 12px;margin:0 0 12px}.feedback-current strong{display:block;color:#f59e0b;letter-spacing:2px;font-size:18px}.feedback-actions{display:flex;gap:8px;flex-wrap:wrap}.stars{display:flex;gap:5px;margin:8px 0 10px}.star{appearance:none;border:0;background:transparent;color:#cbd5e1;font-size:36px;line-height:1;padding:2px;cursor:pointer;transition:transform .14s ease,color .14s ease}.star:hover{transform:translateY(-2px) scale(1.06)}.star.active{color:#f59e0b}.star:focus-visible{outline:3px solid #bfdbfe;border-radius:8px}.rating-label{font-weight:800;color:#475569;margin:0 0 10px}.leaflet-control-attribution{font-size:10px}.result{display:none;margin-top:10px;border-radius:14px;padding:11px}.result.ok{display:block;background:#dcfce7;color:#166534}.result.err{display:block;background:#fee2e2;color:#991b1b}

</head><body><div class="wrap"><div class="top"><div class="detail-heading"><img class="brand-mark" src="/branding/luxten-symbol.png" alt=""><div><h1 id="title">Sesizare</h1><p class="muted" id="sub"></p></div></div><div class="actions" id="topActions"></div></div><div id="main"></div></div><script src="/vendor/leaflet/leaflet.js?v=20260712-11"></script><script src="/map-config.js?v=20260713-19-admin-navigation-blue"></script><script src="/location-utils.js?v=20260712-11"></script><script src="/security-client.js?v=20260712-11"></script><script>
const params=new URLSearchParams(location.search);
const id=params.get('id');
const from=params.get('from')||'user';
const isMobile=window.matchMedia('(max-width: 900px)').matches;
const role=from==='admin'?'admin':'user';
const profile=JSON.parse(localStorage.getItem(role)||'null');
if(from==='admin'&&isMobile){location.replace('/admin-login.html');throw new Error('Admin desktop only')}
if(!profile||!AvariiSecurity.tokenFor(role)){AvariiSecurity.clearSession(role);location.replace(role==='admin'?'/admin-login.html':'/harta.html#account');throw new Error('Autentificare necesară')}
const user=role==='user'?profile:null;
const admin=role==='admin'?profile:null;
const labels={noua:'Nouă',confirmata:'Confirmată',in_lucru:'În lucru',rezolvata:'Rezolvată'};
const pasi=['noua','confirmata','in_lucru','rezolvata'];
const messageDraftKey=`avarii:draft:message:${role}:${id}`;
const feedbackDraftKey=`avarii:draft:feedback:${role}:${id}`;
const ratingDraftKey=`avarii:draft:rating:${role}:${id}`;
let detailMap=null;
let lastSignature='';
let loading=false;
let pendingRefresh=false;
const main=document.getElementById('main');
const titleEl=document.getElementById('title');
const subEl=document.getElementById('sub');
function esc(value){return String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}
function fmt(d){return new Date(d).toLocaleString('ro-RO',{dateStyle:'short',timeStyle:'short'})}
function isOwnAvarie(a){return !!a.isOwn}
function isFollowingAvarie(a){return !!a.isFollowing}
function stored(key){return sessionStorage.getItem(key)||''}
function saveDraft(key,value){if(value)sessionStorage.setItem(key,value);else sessionStorage.removeItem(key)}
function hasUnsavedDraft(){return !!(stored(messageDraftKey)||stored(feedbackDraftKey)||stored(ratingDraftKey))}
function isEditing(){const active=document.activeElement;return hasUnsavedDraft()||active?.id==='mesaj'||active?.id==='feedback-text'}
function signature(a){return JSON.stringify({status:a.status,actualizatLa:a.actualizatLa,urmaritori:a.urmaritori,statusHistory:a.statusHistory,mesaje:a.mesaje,feedback:a.feedback,isFollowing:a.isFollowing,isOwn:a.isOwn,canCommunicate:a.canCommunicate,canSendMessage:a.canSendMessage,titlu:a.titlu,descriere:a.descriere,adresaText:a.adresaText,pozaUrl:a.pozaUrl})}
async function api(url,options={}){const r=await AvariiSecurity.authFetch(url,options,role);if(r.status===401){location.replace(role==='admin'?'/admin-login.html':'/harta.html#account');throw new Error('Autentificare invalidă')}return r}
function followCardHtml(a){if(admin||isOwnAvarie(a))return '';if(isFollowingAvarie(a))return `<div class="card follow-card"><h2>Urmărită</h2></div>`;return `<div class="card follow-card"><h2>Urmărește</h2><button class="btn dark" onclick="follow()">Urmăresc și eu</button></div>`}
async function follow(){const r=await api(`/avarii/${id}/follow`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const data=await r.json();if(!r.ok)return alert(data.eroare||'Nu am putut urmări sesizarea.');await load(true)}
function feedbackStarsValue(item){const value=Number(item?.stele);if(Number.isInteger(value)&&value>=1&&value<=5)return value;if(item?.raspuns==='da')return 5;if(item?.raspuns==='nu')return 1;return 0}
function setRating(value){const box=document.getElementById('feedback-stars');if(!box)return;box.dataset.value=String(value);saveDraft(ratingDraftKey,String(value));box.querySelectorAll('.star').forEach(button=>button.classList.toggle('active',Number(button.dataset.value)<=value));const label=document.getElementById('rating-label');if(label)label.textContent=value?`${value} din 5 stele`:'Alege între 1 și 5 stele'}
async function sendFeedback(){const msg=document.getElementById('feedback-msg');const stars=Number(document.getElementById('feedback-stars')?.dataset.value||0);const text=document.getElementById('feedback-text')?.value||'';if(!stars){msg.className='result err';msg.textContent='Alege o evaluare între 1 și 5 stele.';return}const res=await api(`/avarii/${id}/feedback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stele:stars,mesaj:text})});const data=await res.json();if(res.ok){saveDraft(feedbackDraftKey,'');saveDraft(ratingDraftKey,'');pendingRefresh=false;msg.className='result ok';msg.textContent='Mulțumim. Feedbackul a fost salvat în conversație.';setTimeout(()=>load(true),500)}else{msg.className='result err';msg.textContent=data.eroare||'Nu am putut salva feedbackul.'}}
window.follow=follow;window.setRating=setRating;window.sendFeedback=sendFeedback;
const topActions=document.getElementById('topActions');
topActions.innerHTML=admin?`<a class="btn ghost" href="/admin.html">← Înapoi la admin</a>`:`<a class="btn ghost" href="/harta.html">Înapoi</a>`;
function timelineHtml(a){const hist=a.statusHistory||[];return pasi.map((p,i)=>{const h=hist.find(x=>x.status===p);const isDone=hist.some(x=>x.status===p)||pasi.indexOf(a.status)>=i;return `<div class="tl ${isDone?'done':''}"><div class="dot"></div><div class="tl-body"><b>${labels[p]}</b><span class="muted">${h?`${fmt(h.data)} — ${esc(h.mesaj)}`:'În așteptare'}</span></div></div>`}).join('')}
function feedbackHtml(a){if(admin||a.status!=='rezolvata'||!a.isOwn)return '';const last=(a.feedback||[]).slice(-1)[0];const selected=Number(stored(ratingDraftKey))||feedbackStarsValue(last);const textDraft=sessionStorage.getItem(feedbackDraftKey);const feedbackText=textDraft!==null?textDraft:(last?.mesaj||'');const stars=[1,2,3,4,5].map(value=>`<button type="button" class="star ${value<=selected?'active':''}" data-value="${value}" onclick="setRating(${value})" aria-label="${value} stele">★</button>`).join('');const current=last?`<div class="feedback-current"><span class="muted">Evaluarea ta actuală</span><strong>${'★'.repeat(feedbackStarsValue(last))}${'☆'.repeat(5-feedbackStarsValue(last))}</strong>${last.mesaj?`<span>${esc(last.mesaj)}</span>`:''}</div>`:'';return `<div class="card feedback"><div class="feedback-head"><div class="feedback-icon">★</div><div><h2>Feedback final</h2><p class="muted">Cum a fost rezolvată sesizarea?</p></div></div>${current}<div class="stars" id="feedback-stars" data-value="${selected}" role="radiogroup">${stars}</div><p class="rating-label" id="rating-label">${selected?`${selected} din 5 stele`:'Alege între 1 și 5 stele'}</p><textarea id="feedback-text" maxlength="500" placeholder="Spune-ne ce ți-a plăcut sau ce poate fi îmbunătățit">${esc(feedbackText)}</textarea><div class="feedback-actions"><button class="btn primary" type="button" onclick="sendFeedback()">Salvează feedbackul</button></div><div id="feedback-msg" class="result"></div></div>`}
function messageLabel(m){if(m.rol==='sistem')return 'Actualizare';if(m.rol==='admin')return admin?'Tu · Admin':'Admin';if(m.rol==='user')return admin?esc(m.autor||'Cetățean'):'Tu';return esc(m.autor||'Mesaj')}function messageHtml(m){const own=(admin&&m.rol==='admin')||(!admin&&m.rol==='user');return `<div class="msg ${esc(m.rol)} ${own?'own':''}"><div class="meta"><span class="role-dot"></span><span>${messageLabel(m)}</span><span class="message-time">· ${fmt(m.data)}</span></div>${esc(m.mesaj)}</div>`}function communicationHtml(a){if(!a.canCommunicate)return `<div class="card"><h2>Comunicare</h2><p class="muted">Urmărește sesizarea pentru a vedea actualizările conversației.</p></div>`;const draft=stored(messageDraftKey);const composer=a.canSendMessage?`<form id="msgForm"><textarea id="mesaj" maxlength="600" placeholder="Scrie un mesaj sau o clarificare...">${esc(draft)}</textarea><button class="btn" id="sendMessageBtn" type="submit">Trimite mesaj</button></form>`:`<p class="muted" style="margin:12px 2px 0">Urmărești această sesizare. Doar creatorul sesizării și administratorul pot scrie în conversație.</p>`;return `<div class="card"><h2>Comunicare</h2><div class="chat" id="chat">${(a.mesaje||[]).map(messageHtml).join('')}</div>${composer}</div>`}
function wireDrafts(){
  const message=document.getElementById('mesaj');
  if(message){message.addEventListener('input',()=>{saveDraft(messageDraftKey,message.value);if(!message.value&&pendingRefresh)setTimeout(()=>load(true),100)});}
  const feedback=document.getElementById('feedback-text');
  if(feedback){feedback.addEventListener('input',()=>{saveDraft(feedbackDraftKey,feedback.value);if(!feedback.value&&!stored(ratingDraftKey)&&pendingRefresh)setTimeout(()=>load(true),100)});}
}
function refreshDetailMap(){if(detailMap)refreshAvariiMap(detailMap)}
async function renderDetail(a,locationLabel){
  if(detailMap){detailMap.remove();detailMap=null}
  titleEl.textContent=a.titlu;
  subEl.textContent=`${a.categorie} · raportată la ${fmt(a.dataRaportare)}`;
  main.innerHTML=`<div class="layout"><section><div class="card"><span class="badge ${esc(a.status)}">${labels[a.status]||esc(a.status)}</span><h2>Detalii</h2>${a.descriere?`<p>${esc(a.descriere)}</p>`:''}<div class="meta-grid"><div class="meta-box"><b>${Number(a.urmaritori||0)}</b><span class="muted">urmăritori</span></div><div class="meta-box"><b>${fmt(a.actualizatLa||a.dataRaportare)}</b><span class="muted">ultima actualizare</span></div></div><p class="muted"><b>Locație:</b> ${esc(locationLabel)}</p><p class="muted"><b>Raportat de:</b> ${esc(a.autor||'Cetățean')}</p><div id="map"></div>${a.pozaUrl?`<img class="photo" src="${esc(a.pozaUrl)}" alt="Poză avarie">`:''}</div><div class="card"><h2>Timeline</h2><div class="timeline">${timelineHtml(a)}</div></div>${feedbackHtml(a)}</section><section>${followCardHtml(a)}${communicationHtml(a)}</section></div>`;
  if(a.lat&&a.lng){detailMap=createAvariiMap('map',{center:[a.lat,a.lng],zoom:16,minZoom:12});L.marker([a.lat,a.lng]).addTo(detailMap);refreshDetailMap()}else{document.getElementById('map').innerHTML='<p class="muted">Sesizarea are adresă scrisă manual.</p>'}
  wireDrafts();
  const chat=document.getElementById('chat');if(chat)chat.scrollTop=chat.scrollHeight;
  const form=document.getElementById('msgForm');
  if(form)form.onsubmit=async e=>{e.preventDefault();const field=document.getElementById('mesaj');const button=document.getElementById('sendMessageBtn');const value=field.value.trim();if(value.length<2)return alert('Scrie cel puțin 2 caractere.');if(button){button.disabled=true;button.textContent='Se trimite...'}try{const response=await api(`/avarii/${id}/messages`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mesaj:value})});const data=await response.json();if(!response.ok)return alert(data.eroare||'Nu am putut trimite mesajul.');saveDraft(messageDraftKey,'');field.value='';pendingRefresh=false;await load(true)}finally{if(button){button.disabled=false;button.textContent='Trimite mesaj'}}};
}
async function load(force=false){
  if(loading)return;
  loading=true;
  try{
    const r=await api('/avarii/'+id);
    if(!r.ok){const data=await r.json().catch(()=>({}));main.innerHTML=`<div class="card">${esc(data.eroare||'Sesizarea nu a fost găsită.')}</div>`;return}
    const a=await r.json();
    const nextSignature=signature(a);
    if(!force&&nextSignature===lastSignature)return;
    if(!force&&lastSignature&&isEditing()){pendingRefresh=true;return}
    let locationLabel=avariiLocationLabel(a);
    if(isGenericAvariiLocation(a.adresaText)&&a.lat&&a.lng)locationLabel=await reverseAvariiLocation(a.lat,a.lng);
    await renderDetail(a,locationLabel);
    lastSignature=nextSignature;
    pendingRefresh=false;
  }finally{loading=false}
}
load(true);
setInterval(()=>{if(!document.hidden)load(false)},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load(false);refreshDetailMap()}});
window.addEventListener('resize',refreshDetailMap,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(refreshDetailMap,250));
window.addEventListener('pageshow',refreshDetailMap);
</script></body></html>
