<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cont nou</title><link rel="stylesheet" href="/branding/branding.css"><style>
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f8fb;margin:0;color:#172033}.wrap{max-width:480px;margin:0 auto;padding:24px 18px}.card{background:white;border-radius:24px;padding:26px;box-shadow:0 18px 50px rgba(20,45,80,.10)}h1{margin:0 0 6px}.muted{color:#607087;line-height:1.45}label{display:block;margin:14px 0 7px;font-weight:700}input{width:100%;padding:13px;border:1px solid #d8e0ea;border-radius:12px;font-size:16px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:#16a34a;color:#fff;font-size:16px;font-weight:800;cursor:pointer}.link{display:block;text-align:center;margin-top:16px;color:#1d4ed8;text-decoration:none;font-weight:700}.err{display:none;background:#fee2e2;color:#991b1b;padding:12px;border-radius:12px;margin-top:14px}.anti-bot-field{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;overflow:hidden!important}.turnstile-slot{margin-top:14px}
@media(max-width:520px){body{overflow-x:hidden}.wrap{padding:16px 12px}.card{border-radius:18px;padding:20px}nav{display:grid!important;grid-template-columns:1fr!important}nav a{width:100%;text-align:center;display:block}input,button{font-size:16px}}</style><script src="/cache-bootstrap.js?v=20260712-10"></script>
</head><body><div class="wrap"><div class="card"><img class="auth-logo" src="/branding/luxten-logo.png" alt="LUXTEN"><h1>Creează cont</h1><form id="f"><div class="anti-bot-field" aria-hidden="true"><label for="website">Website</label><input id="website" autocomplete="off" tabindex="-1"></div><input id="formStartedAt" type="hidden"><input id="turnstileToken" type="hidden"><label>Prenume</label><input id="prenume" required><label>Nume</label><input id="nume" required><label>Email</label><input id="email" type="email" required><label>Parolă</label><input id="parola" type="password" minlength="8" maxlength="128" required><div id="register-turnstile" class="turnstile-slot"></div><button>Creează cont</button><div id="err" class="err"></div></form><a class="link" href="/harta.html#account">Am deja cont</a></div></div><script src="/security-client.js"></script><script>
formStartedAt.value=Date.now();AvariiSecurity.loadTurnstile('register-turnstile','turnstileToken');document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.style.display='none';const r=await fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prenume:prenume.value,nume:nume.value,email:email.value,parola:parola.value,website:website.value,formStartedAt:formStartedAt.value,turnstileToken:turnstileToken.value})});const j=await r.json();if(!r.ok){err.textContent=j.eroare||'Eroare';err.style.display='block';return}AvariiSecurity.saveSession('user',j);location.href='/harta.html'};
</script></body></html>
