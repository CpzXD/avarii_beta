<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login admin</title><link rel="stylesheet" href="/branding/branding.css"><style>
*{box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#111827;margin:0;color:#fff}.wrap{max-width:430px;margin:0 auto;padding:34px 18px}.card{background:#1f2937;border:1px solid #374151;border-radius:24px;padding:26px;box-shadow:0 25px 70px rgba(0,0,0,.25)}h1{margin:0 0 6px}.muted{color:#cbd5e1;line-height:1.45}label{display:block;margin:16px 0 7px;font-weight:700}input{width:100%;padding:13px;border:1px solid #4b5563;background:#111827;color:white;border-radius:12px;font-size:16px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:14px;background:#f59e0b;color:#111827;font-size:16px;font-weight:900;cursor:pointer}.demo{background:#111827;padding:12px;border-radius:14px;margin:16px 0;color:#e5e7eb}.err{display:none;background:#7f1d1d;color:#fee2e2;padding:12px;border-radius:12px;margin-top:14px}a{color:#93c5fd;text-decoration:none}.mobile-blocker{display:none;background:#fff;color:#172033;min-height:100dvh;padding:22px 16px}.mobile-blocker .box{max-width:460px;margin:0 auto;background:#f8fafc;border:1px solid #e5e7eb;border-radius:22px;padding:22px;box-shadow:0 14px 40px rgba(15,23,42,.12)}.mobile-blocker a{display:inline-flex;margin-top:12px;background:#16a34a;color:white;padding:12px 15px;border-radius:999px;text-decoration:none;font-weight:900}

</head><body><div class="mobile-blocker"><div class="box"><img class="mobile-brand-logo" src="/branding/luxten-logo.png" alt="LUXTEN"><h1>Admin doar pe PC</h1><a href="/harta.html">Avarii iluminat</a></div></div><div class="wrap"><p><a href="/harta.html">← Avarii iluminat</a></p><div class="card"><img class="auth-logo" src="/branding/luxten-logo.png" alt="LUXTEN"><h1>Admin avarii</h1><form id="f"><label>Email admin</label><input id="email" type="email" required autocomplete="username"><label>Parolă</label><input id="parola" type="password" required autocomplete="current-password"><button>Intră în admin</button><div id="err" class="err"></div></form></div></div><script src="/security-client.js"></script><script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.style.display='none';const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,parola:parola.value,rol:'admin'})});const j=await r.json();if(!r.ok){err.textContent=j.eroare||'Eroare login';err.style.display='block';return}AvariiSecurity.saveSession('admin',j);location.href='/admin.html'};
</script></body></html>
